# nav2_params.yaml — OriginCar Navigation2 参数配置
#
# 方案选择：
#   方案1（推荐）：使用静态 TF 桥接 odom_combined → odom，Nav2 默认参数直接用，无需此文件
#   方案2：使用此文件覆盖参数（适用 M10 完整导航栈）
#
# 方案1 用法（只需在 EKF 终端加一行静态 TF）：
#   ros2 run tf2_ros static_transform_publisher 0 0 0 0 0 0 odom_combined odom
#   ros2 launch nav2_bringup bringup_launch.py map:=/root/maps/competition_map.yaml
#
# 方案2 用法：
#   ros2 launch nav2_bringup bringup_launch.py \
#     map:=/root/maps/competition_map.yaml \
#     params_file:=/userdata/dev_ws/src/nav2_params.yaml
#
# 基于 FRAMEWORK.md 3.10 节规格。

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/root/maps/competition_map.yaml"
    frame_id: "map"
    topic_name: "/map"

amcl:
  ros__parameters:
    use_sim_time: false
    # ★ 关键：OriginCar EKF 发布 odom_combined
    odom_frame_id: "odom_combined"
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    scan_topic: /scan
    robot_model_type: "differential"
    laser_model_type: "likelihood_field"
    laser_max_range: 10.0
    laser_min_range: 0.12
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    tf_broadcast: true
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_footprint"
    odom_topic: "/odom_combined"
    default_bt_xml_filename: "navigate_to_pose_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - "nav2_compute_path_to_pose_action_bt_node"
      - "nav2_compute_path_through_poses_action_bt_node"
      - "nav2_smooth_path_action_bt_node"
      - "nav2_follow_path_action_bt_node"
      - "nav2_spin_action_bt_node"
      - "nav2_wait_action_bt_node"
      - "nav2_back_up_action_bt_node"
      - "nav2_drive_on_heading_bt_node"
      - "nav2_clear_costmap_service_bt_node"
      - "nav2_is_stuck_condition_bt_node"
      - "nav2_goal_reached_condition_bt_node"
      - "nav2_goal_updated_condition_bt_node"
      - "nav2_globally_updated_goal_condition_bt_node"
      - "nav2_is_path_valid_condition_bt_node"
      - "nav2_initial_pose_received_condition_bt_node"
      - "nav2_reinitialize_global_localization_service_bt_node"
      - "nav2_rate_controller_bt_node"
      - "nav2_distance_controller_bt_node"
      - "nav2_speed_controller_bt_node"
      - "nav2_truncate_path_action_bt_node"
      - "nav2_truncate_path_local_action_bt_node"
      - "nav2_goal_updater_node_bt_node"
      - "nav2_recovery_node_bt_node"
      - "nav2_pipeline_sequence_bt_node"
      - "nav2_round_robin_node_bt_node"
      - "nav2_transform_available_condition_bt_node"
      - "nav2_time_expired_condition_bt_node"
      - "nav2_path_expiring_timer_condition"
      - "nav2_distance_traveled_condition_bt_node"
      - "nav2_single_trigger_bt_node"
      - "nav2_goal_updated_controller_bt_node"
      - "nav2_navigate_through_poses_action_bt_node"
      - "nav2_navigate_to_pose_action_bt_node"
      - "nav2_remove_passed_goals_action_bt_node"
      - "nav2_planner_selector_bt_node"
      - "nav2_controller_selector_bt_node"
      - "nav2_goal_checker_selector_bt_node"
      - "nav2_controller_cancel_bt_node"
      - "nav2_path_longer_on_approach_bt_node"
      - "nav2_wait_cancel_bt_node"
      - "nav2_spin_cancel_bt_node"
      - "nav2_back_up_cancel_bt_node"
      - "nav2_drive_on_heading_cancel_bt_node"

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.3
      max_linear_vel: 0.5
      min_linear_vel: 0.05
      lookahead_dist: 0.5
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.8
      use_collision_detection: true
      collision_checking_separation_dist: 0.2
      allow_reversing: false
      transform_tolerance: 0.5

planner_server:
  ros__parameters:
    planner_plugins: ["GridBased"]
    use_sim_time: false
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "map"
    robot_base_frame: "base_footprint"
    local_costmap_topic: "/local_costmap/costmap_raw"
    local_footprint_topic: "/local_costmap/published_footprint"
    transform_tolerance: 0.5

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    stop_on_failure: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    max_velocity: [0.5, 0.0, 1.0]
    min_velocity: [-0.5, 0.0, -1.0]
    odom_topic: "/odom_combined"
    velocity_timeout: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      # ★ 关键：OriginCar 使用 odom_combined
      global_frame: "odom_combined"
      robot_base_frame: "base_footprint"
      robot_radius: 0.22
      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.4
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: "scan"
        scan:
          topic: "/scan"
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: "map"
      robot_base_frame: "base_footprint"
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      rolling_window: false
      width: 60
      height: 60
      plugins: ["static_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.6
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
