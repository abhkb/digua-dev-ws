# 地瓜机器人比赛自动巡航参数
#
# 坐标系：map
# 当前版本：任务 1+3 最小闭环 P -> QR -> 指定通道进退 -> P
# 说明：
#   - initial_pose 用于自动发布 /initialpose。
#   - waypoints 中保存采集到的真实目标点。
#   - route_minimal 用于第一阶段自动导航验收。
#   - 后续顺/逆时针通道航点在 clockwise_route / anticlockwise_route 中追加。

dg_competition:
  map_frame: "map"
  robot_base_frame: "base_footprint"

  initial_pose:
    name: "p_start"
    x: 0.0
    y: 0.0
    z: 0.0
    yaw: 0.0
    orientation:
      x: 0.0
      y: 0.0
      z: 0.0
      w: 1.0

  waypoints:
    qr_stop:
      description: "QR 任务发布点 / 扫码点"
      x: 3.8242361932231477
      y: 1.372623846549827
      z: 0.0
      yaw: 0.562951
      yaw_deg: 32.255
      orientation:
        x: 0.0
        y: 0.0
        z: 0.2777735945982985
        w: 0.9606465687982965

    p_return:
      description: "返回 P 点 / 停车点"
      ignore_yaw: true
      post_arrival_forward_distance_m: 0.15
      post_arrival_forward_speed_mps: 0.05
      x: 0.047047394274798364
      y: -0.0013009601122881778
      z: 0.0
      yaw: -2.615785
      yaw_deg: -149.873
      orientation:
        x: 0.0
        y: 0.0
        z: -0.9656394267554317
        w: 0.25988554691525506

    task13_channel_near:
      description: "任务 1+3：到通道附近，准备进入指定通道"
      post_arrival_settle_sec: 1.2
      post_arrival_pre_turn_radius_m: 0.35
      post_arrival_pre_turn_angle_deg: 30.0
      post_arrival_pre_turn_speed_mps: 0.20
      post_arrival_pre_turn_direction: "right"
      post_arrival_return_to_pre_turn_pose: true
      post_arrival_forward_distance_m: 1.00
      post_arrival_forward_speed_mps: 0.25
      post_arrival_reverse_distance_m: 1.00
      post_arrival_reverse_speed_mps: 0.25
      # 直行结束后保持零速，给底盘留出正转切换到反转的时间。
      post_arrival_direction_change_pause_sec: 1.0
      x: 2.2959826696340824
      y: 1.6753652565703052
      z: 0.0
      yaw: 2.433013
      yaw_deg: 139.401
      orientation:
        x: 0.0
        y: 0.0
        z: 0.9378931802808568
        w: 0.34692417382284035

  routes:
    # 第一阶段最小闭环：按列表顺序导航。
    # 以后增加中间点，只需要在 waypoints 中新增点，并把名字插入这里。
    route_minimal:
      - "qr_stop"
      - "task13_channel_near"
      - "p_return"

    # 后续扫码后，奇数二维码选择 clockwise_route。
    clockwise_route: []

    # 后续扫码后，偶数二维码选择 anticlockwise_route。
    anticlockwise_route: []

  navigation:
    initialpose_publish_count: 5
    initialpose_interval_sec: 0.3
    # 发车延迟：Nav2 action server 就绪并发布 initialpose 后，
    # nav_cruise 等待该秒数再发送第一个导航目标。
    start_delay_sec: 4.0
    nav_timeout_sec: 90.0
    goal_xy_tolerance: 0.25
    default_yaw_goal_tolerance: 0.45
    ignore_yaw_goal_tolerance: 3.14
    controller_server_node: "/controller_server"
    # true：nav_cruise.py 根据相邻航点自动计算 goal yaw。
    # false：使用每个 waypoint 中记录的 yaw / quaternion。
    # 当前先使用踩点保存的 QR / P 点角度，避免到点朝向与采集点位不一致。
    auto_compute_goal_yaw: false

  qr:
    clockwise_signal: 3
    anticlockwise_signal: 4
    # 必须先到达固定 QR 点再执行扫码后的右后弧倒车。
    skip_qr_goal_on_signal: false
    post_detection_motion:
      enabled: true
      type: "arc"
      travel_direction: "reverse"
      turn_direction: "right"
      radius_m: 0.35
      angle_deg: 100.0
      speed_mps: 0.20
      settle_sec: 1.2
